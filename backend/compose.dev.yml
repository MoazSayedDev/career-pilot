services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    command: sh -c "npx prisma migrate deploy && npm run start:dev"

    env_file:
      - .env

    environment:
      NODE_ENV: development
      PORT: 8000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-career_pilot}
      REDIS_HOST: redis
      REDIS_PORT: 6379

    ports:
      - '8000:8000'

    volumes:
      - .:/app
      - backend_node_modules:/app/node_modules

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  backend_node_modules:
